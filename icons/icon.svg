<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Bleyjur</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FDCCF"/>
      <stop offset="1" stop-color="#4FB5B0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF3F7"/>
    </linearGradient>
    <clipPath id="diaper">
      <path id="shape" d="M118 160 Q106 160 106 172 L106 250 Q106 262 118 264 Q180 276 196 360 Q198 372 212 372 L300 372 Q314 372 316 360 Q332 276 394 264 Q406 262 406 250 L406 172 Q406 160 394 160 Z"/>
    </clipPath>
  </defs>

  <!-- full-bleed background (platforms apply their own rounding/masks) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- sparkles -->
  <g fill="#FFF6C9">
    <path d="M396 92 L402 110 L420 116 L402 122 L396 140 L390 122 L372 116 L390 110 Z"/>
    <path d="M122 380 L126 392 L138 396 L126 400 L122 412 L118 400 L106 396 L118 392 Z"/>
    <circle cx="140" cy="118" r="6"/>
    <circle cx="398" cy="370" r="5"/>
  </g>

  <!-- soft shadow -->
  <ellipse cx="256" cy="400" rx="112" ry="14" fill="#2E8A86" opacity="0.35"/>

  <!-- side tabs -->
  <rect x="86" y="196" width="36" height="44" rx="12" fill="#FFD166"/>
  <rect x="390" y="196" width="36" height="44" rx="12" fill="#FFD166"/>

  <!-- diaper body -->
  <path d="M118 160 Q106 160 106 172 L106 250 Q106 262 118 264 Q180 276 196 360 Q198 372 212 372 L300 372 Q314 372 316 360 Q332 276 394 264 Q406 262 406 250 L406 172 Q406 160 394 160 Z"
        fill="url(#body)" stroke="#2F4858" stroke-width="8" stroke-linejoin="round"/>

  <!-- waistband -->
  <g clip-path="url(#diaper)">
    <rect x="100" y="156" width="312" height="38" fill="#A7D8F5"/>
    <g fill="#FFFFFF" opacity="0.8">
      <circle cx="156" cy="175" r="5"/><circle cx="196" cy="175" r="5"/>
      <circle cx="236" cy="175" r="5"/><circle cx="276" cy="175" r="5"/>
      <circle cx="316" cy="175" r="5"/><circle cx="356" cy="175" r="5"/>
    </g>
  </g>
  <path d="M106 194 L406 194" stroke="#2F4858" stroke-width="6" stroke-linecap="round" opacity="0.25"/>
  <!-- redraw outline over waistband -->
  <path d="M118 160 Q106 160 106 172 L106 250 Q106 262 118 264 Q180 276 196 360 Q198 372 212 372 L300 372 Q314 372 316 360 Q332 276 394 264 Q406 262 406 250 L406 172 Q406 160 394 160 Z"
        fill="none" stroke="#2F4858" stroke-width="8" stroke-linejoin="round"/>

  <!-- face -->
  <ellipse cx="198" cy="286" rx="15" ry="10" fill="#FF9AA2" opacity="0.85"/>
  <ellipse cx="314" cy="286" rx="15" ry="10" fill="#FF9AA2" opacity="0.85"/>
  <circle cx="222" cy="252" r="11" fill="#2F4858"/>
  <circle cx="290" cy="252" r="11" fill="#2F4858"/>
  <circle cx="226" cy="248" r="3.5" fill="#FFFFFF"/>
  <circle cx="294" cy="248" r="3.5" fill="#FFFFFF"/>
  <path d="M232 284 Q256 310 280 284" fill="none" stroke="#2F4858" stroke-width="8" stroke-linecap="round"/>
</svg>
